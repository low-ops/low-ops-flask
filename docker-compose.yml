services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
      - "${METRICS_PORT:-8001}:${METRICS_PORT:-8001}"
    environment:
      PORT: ${PORT:-8000}
      METRICS_PORT: ${METRICS_PORT:-8001}
      SECRET_KEY: ${SECRET_KEY:-flask-insecure-change-me}
      DEBUG: ${DEBUG:-true}
      APPLICATION_URL: ${APPLICATION_URL:-http://localhost:8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: people_desk
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: myapp-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_PERFORM_DELETE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: people_desk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d people_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/myapp-uploads || true;
      exit 0;
      "
